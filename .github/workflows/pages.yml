# Deploys the static site (landing page, legal pages and the app/ prototype) to GitHub Pages.
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button for a manual redeploy

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that local links and scripts exist
        run: |
          status=0
          for page in *.html app/*.html; do
            dir=$(dirname "$page")
            for ref in $(grep -oE '(href|src)="[^"#?]+' "$page" | sed -E 's/^(href|src)="//' | grep -vE '^(https?:|mailto:|tel:|data:|//)'); do
              if [ ! -e "$dir/$ref" ]; then echo "::error file=$page::missing $ref"; status=1; fi
            done
          done
          for js in app/*.js; do node --check "$js" || status=1; done
          exit $status

      - name: Collect the site files
        run: |
          mkdir -p _site
          cp -r index.html privacy.html terms.html .nojekyll app _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
